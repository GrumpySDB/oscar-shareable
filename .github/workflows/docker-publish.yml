name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - multi-user-redesign
      - 'sec/*'
      - 'feat/*'
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME_UPLOADER: ${{ github.repository }}-uploader
  IMAGE_NAME_OSCAR: ${{ github.repository }}-oscar
  IMAGE_NAME_NGINX: ${{ github.repository }}-nginx
  IMAGE_NAME_PROXY: ${{ github.repository }}-proxy

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- UPLOADER IMAGE ---
      - name: Extract metadata (tags, labels) for Uploader
        id: meta-uploader
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UPLOADER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Uploader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-uploader.outputs.tags }}
          labels: ${{ steps.meta-uploader.outputs.labels }}
          cache-from: type=gha,scope=uploader
          cache-to: type=gha,mode=max,scope=uploader

      # --- OSCAR IMAGE ---
      - name: Extract metadata (tags, labels) for OSCAR
        id: meta-oscar
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OSCAR }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push OSCAR image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-oscar
          file: ./docker-oscar/Dockerfile
          push: true
          tags: ${{ steps.meta-oscar.outputs.tags }}
          labels: ${{ steps.meta-oscar.outputs.labels }}
          cache-from: type=gha,scope=oscar
          cache-to: type=gha,mode=max,scope=oscar

      # --- NGINX IMAGE (Patched) ---
      - name: Extract metadata (tags, labels) for Nginx
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NGINX }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile.patched
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      # --- DOCKER SOCKET PROXY IMAGE (Patched) ---
      - name: Extract metadata (tags, labels) for Proxy
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Proxy image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-socket-proxy
          file: ./docker-socket-proxy/Dockerfile.patched
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
