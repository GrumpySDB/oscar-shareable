name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - multi-user-redesign
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME_UPLOADER: ${{ github.repository }}-uploader
  IMAGE_NAME_OSCAR: ${{ github.repository }}-oscar

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- UPLOADER IMAGE ---
      - name: Extract metadata (tags, labels) for Uploader
        id: meta-uploader
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UPLOADER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Uploader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-uploader.outputs.tags }}
          labels: ${{ steps.meta-uploader.outputs.labels }}
          cache-from: type=gha,scope=uploader
          cache-to: type=gha,mode=max,scope=uploader

      # --- OSCAR IMAGE ---
      - name: Extract metadata (tags, labels) for OSCAR
        id: meta-oscar
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OSCAR }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push OSCAR image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-oscar
          file: ./docker-oscar/Dockerfile
          push: true
          tags: ${{ steps.meta-oscar.outputs.tags }}
          labels: ${{ steps.meta-oscar.outputs.labels }}
          cache-from: type=gha,scope=oscar
          cache-to: type=gha,mode=max,scope=oscar
