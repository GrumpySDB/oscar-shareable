services:

  config-prepper:
    image: nginx:stable-alpine
    container_name: config-prepper
    volumes:
      - ./cloudflared:/template:ro
      - cloudflared-config:/etc/cloudflared
    env_file:
      - .env
    command: >
      sh -c "envsubst < /template/config.yml.example > /etc/cloudflared/config.yml"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN_FILE: /app/secrets/tunnel_token
      CF_TUNNEL_ID: ${CF_TUNNEL_ID}
      CF_HOSTNAME: ${CF_HOSTNAME}
    restart: unless-stopped
    volumes:
      - cloudflared-config:/etc/cloudflared:ro
      - ./secrets/tunnel_token.txt:/app/secrets/tunnel_token:ro
    depends_on:
      config-prepper:
        condition: service_completed_successfully
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
      - DELETE=1
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-internal
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    expose:
      - "80"
      - "443"
    env_file:
      - .env
    # env_file provides the variables for envsubst to use in templates
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  uploader:
    container_name: uploader
    # Pull pre-built image from GHCR
    image: ghcr.io/grumpysdb/oscar-shareable-uploader:multi-user-redesign
    expose:
      - "8080"
    group_add:
      - "952"
    env_file:
      - .env
    environment:
      HTTP_PORT: 8080
      UPLOAD_UID: 911
      UPLOAD_GID: 911
      OSCAR_BASE_URL: http://oscar:3000
      DATABASE_PATH: /app/data/uploads/db.sqlite
      DOCKER_HOST_PATH: .
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      OSCAR_PROFILE_VERSION: ${OSCAR_PROFILE_VERSION:-1.7.1+-plus}
      JWT_SECRET_FILE: /app/secrets/jwt_secret
      APP_USERNAME_FILE: /app/secrets/app_username
      APP_PASSWORD_FILE: /app/secrets/app_password
      DISCORD_CLIENT_SECRET_FILE: /app/secrets/discord_client_secret
    restart: unless-stopped
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/profiles:/app/data/profiles
      - ./data/app_config:/app/data/app_config
      - ./secrets/jwt_secret.txt:/app/secrets/jwt_secret:ro
      - ./secrets/app_username.txt:/app/secrets/app_username:ro
      - ./secrets/app_password.txt:/app/secrets/app_password:ro
      - ./secrets/discord_client_secret.txt:/app/secrets/discord_client_secret:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/tmp
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - nginx
      - cloudflared
      - docker-socket-proxy
    networks:
      - internal

  oscar:
    # Pull pre-built image from GHCR
    image: ghcr.io/grumpysdb/oscar-shareable-oscar:multi-user-redesign
    profiles: [ "template" ]
    container_name: oscar-template
    restart: "no"
    ports:
      - 127.0.0.1:3030:3000
    volumes:
      - ./data/profiles:/config/Documents/OSCAR_Data:rw
      - ./data/uploads:/config/Documents/SDCARD:rw
      - ./data/app_config:/config/.config/OSCAR_Team:rw
    environment:
      PUID: "911"
      PGID: "911"
      TZ: "America/Chicago"
      TITLE: "OSCAR ${OSCAR_VERSION:-1.7.1}"
      START_DOCKER: "false"
      DISABLE_IPV6: "true"
      NO_DECOR: "true"
      NO_GAMEPAD: "true"
      HARDEN_DESKTOP: "true"
      HARDEN_OPENBOX: "true"
      SELKIES_ENABLE_CURSORS: "true"
      SELKIES_AUDIO_ENABLED: "false"
      SELKIES_GAMEPAD_ENABLED: "false"
      SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
      SELKIES_UI_SIDEBAR_SHOW_CLIPBOARD: "false"
      SELKIES_UI_SIDEBAR_SHOW_AUDIO_SETTINGS: "false"
      SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_CLIPBOARD_ENABLED: "false"
      SELKIES_SECOND_SCREEN: "false"
      SELKIES_ENABLE_SHARING: "false"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

volumes:
  cloudflared-config:

    # Using bind mounts for secrets to ensure Rootless Docker compatibility
    # (Removed secrets section)

networks:
  internal:
    driver: bridge
